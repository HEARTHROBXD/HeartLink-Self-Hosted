<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HeartLink 云端管理</title>
  <style>
    :root{color-scheme:dark;--bg:#08111d;--panel:#101c2a;--line:#26384d;--ink:#edf3fb;--muted:#91a2b8;--accent:#4f7ff5;--danger:#ff737d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable","Microsoft YaHei UI",system-ui,sans-serif;display:grid;place-items:center}
    .login{width:min(880px,calc(100vw - 32px));display:grid;grid-template-columns:minmax(250px,.8fr) minmax(340px,1.2fr);border:1px solid var(--line);background:var(--panel);min-height:450px}
    .identity{padding:44px 38px;border-right:1px solid var(--line);background:#0c1725;display:flex;flex-direction:column;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:white;font-weight:800;letter-spacing:-1px}.brand strong{font-size:15px}.identity h1{font-size:26px;line-height:1.18;margin:44px 0 12px;letter-spacing:-.5px}.identity p,.footnote{color:var(--muted);margin:0}.network{display:flex;align-items:center;gap:9px;color:#b8c7da}.dot{width:7px;height:7px;background:#32c695}
    form{padding:54px 46px;display:flex;flex-direction:column;justify-content:center}.form-title{font-size:15px;font-weight:700;margin:0 0 6px}.form-copy{color:var(--muted);margin:0 0 26px}.error{color:var(--danger);border:1px solid #703141;background:#27151d;padding:9px 11px;margin:0 0 14px}label{display:grid;gap:7px;color:#b9c7d8;font-weight:600}input{width:100%;margin:0 0 15px;padding:12px 13px;background:#091421;color:white;border:1px solid #30455e;border-radius:2px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #4f7ff52b}button{width:100%;padding:12px 15px;background:var(--accent);color:white;border:1px solid var(--accent);border-radius:2px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#638df6}button:focus-visible{outline:2px solid white;outline-offset:2px}
    @media(max-width:720px){body{background:var(--bg)}.login{grid-template-columns:1fr}.identity{min-height:220px;border-right:0;border-bottom:1px solid var(--line);padding:30px}.identity h1{margin-top:28px}form{padding:34px 30px}}
  </style>
</head>
<body>
  <main class="login">
    <section class="identity" aria-label="HeartLink 管理端说明">
      <div>
        <div class="brand"><span class="mark">HL</span><strong>HeartLink</strong></div>
        <h1>官方云控制台</h1>
        <p>账户、设备、同步密文、通知服务与客户端版本的内部管理入口。</p>
      </div>
      <div class="network"><span class="dot"></span><span>仅允许业务内网访问</span></div>
    </section>
    <form action="/login" method="post">
      <h2 class="form-title">管理员验证</h2>
      <p class="form-copy">后台只显示同步记录元数据，无法解密用户的服务器资料、凭据和命令内容。</p>
      <!--ERROR-->
      <label for="password">管理密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required autofocus>
      <button type="submit">进入控制台</button>
    </form>
  </main>
</body>
</html>
