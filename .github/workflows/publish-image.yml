name: Publish self-hosted image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example 1.4.0
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-self-hosted-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'HEARTHROBXD/HeartLink-Self-Hosted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          [[ '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: metadata
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo 'ghcr.io/hearthrobxd/heartlink-self-hosted:${{ inputs.version }}'
            if [[ '${{ inputs.publish_latest }}' == 'true' ]]; then
              echo 'ghcr.io/hearthrobxd/heartlink-self-hosted:latest'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/HEARTHROBXD/HeartLink-Self-Hosted
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=self-hosted-multiarch
          cache-to: type=gha,mode=max,scope=self-hosted-multiarch
          provenance: mode=max
          sbom: true

      - name: Record immutable manifest digest
        shell: bash
        run: |
          printf '%s@%s\n' \
            'ghcr.io/hearthrobxd/heartlink-self-hosted:${{ inputs.version }}' \
            '${{ steps.build.outputs.digest }}' | tee image-digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: self-hosted-image-${{ inputs.version }}-digest
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 90
