name: Bootstrap self-hosted installer executable modes

on:
  push:
    branches:
      - fix/self-hosted-installer-v130

permissions:
  contents: write

jobs:
  fix-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit Linux executable modes
        run: |
          chmod +x install.sh tests/install-smoke.sh
          git add --chmod=+x install.sh tests/install-smoke.sh
          if git diff --cached --quiet; then
            echo "Executable modes are already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restore installer executable modes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
