services:
  mysql:
    image: "${HEARTLINK_MYSQL_IMAGE:-mysql:8.4.10}"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${HEARTLINK_DATABASE_NAME:-heartlink}"
      MYSQL_USER: "${HEARTLINK_DATABASE_USER:-heartlink}"
      MYSQL_PASSWORD: "${HEARTLINK_DATABASE_PASSWORD:?set HEARTLINK_DATABASE_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${HEARTLINK_DATABASE_ROOT_PASSWORD:?set HEARTLINK_DATABASE_ROOT_PASSWORD}"
      TZ: "${TZ:-Asia/Shanghai}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    volumes:
      - heartlink-mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database

  sync:
    image: "${HEARTLINK_SERVER_IMAGE:?set HEARTLINK_SERVER_IMAGE to the pinned prebuilt image}"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HEARTLINK_SERVICE_ROLE: "self-hosted"
      HEARTLINK_CLOUD_HANDSHAKE_KEY_FILE: "/run/heartlink-secrets/cloud-handshake.key"
      HEARTLINK_CLOUD_HANDSHAKE_KEY_ID: "${HEARTLINK_HANDSHAKE_KEY_ID:-self-hosted-cloud-v1}"
      HEARTLINK_ADMIN_PASSWORD_FILE: "/run/heartlink-secrets/admin-password.txt"
      HEARTLINK_ADMIN_SETTINGS_KEY_FILE: "/run/heartlink-secrets/admin-settings.key"
      HEARTLINK_DATABASE_HOST: mysql
      HEARTLINK_DATABASE_PORT: "3306"
      HEARTLINK_DATABASE_NAME: "${HEARTLINK_DATABASE_NAME:-heartlink}"
      HEARTLINK_DATABASE_USER: "${HEARTLINK_DATABASE_USER:-heartlink}"
      HEARTLINK_DATABASE_PASSWORD: "${HEARTLINK_DATABASE_PASSWORD:?set HEARTLINK_DATABASE_PASSWORD}"
      HEARTLINK_CLOUD_BIND: "0.0.0.0:8787"
      HEARTLINK_ADMIN_BIND: "0.0.0.0:8789"
      HEARTLINK_REGISTRATION_ENABLED: "${HEARTLINK_REGISTRATION_ENABLED:-true}"
      HEARTLINK_RECOVERY_EMAIL_WEBHOOK: "${HEARTLINK_RECOVERY_EMAIL_WEBHOOK:-}"
      HEARTLINK_RECOVERY_SMS_WEBHOOK: "${HEARTLINK_RECOVERY_SMS_WEBHOOK:-}"
      HEARTLINK_RECOVERY_WEBHOOK_TOKEN: "${HEARTLINK_RECOVERY_WEBHOOK_TOKEN:-}"
      HEARTLINK_RECOVERY_PEPPER: "${HEARTLINK_RECOVERY_PEPPER:-}"
      RUST_LOG: "heartlink_server=info,tower_http=info"
    volumes:
      - "${HEARTLINK_HANDSHAKE_KEY_PATH:-./secrets/cloud-handshake.key}:/run/heartlink-secrets/cloud-handshake.key:ro"
      - "${HEARTLINK_ADMIN_PASSWORD_PATH:-./secrets/admin-password.txt}:/run/heartlink-secrets/admin-password.txt:ro"
      - "${HEARTLINK_ADMIN_SETTINGS_KEY_PATH:-./secrets/admin-settings.key}:/run/heartlink-secrets/admin-settings.key:ro"
    ports:
      - "${HEARTLINK_PUBLISH_IP:-0.0.0.0}:8787:8787"
      - "${HEARTLINK_PANEL_PUBLISH_IP:-0.0.0.0}:8789:8789"
    networks:
      - database
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  heartlink-mysql-data:

networks:
  database:
    internal: true
  edge:
    driver: bridge
